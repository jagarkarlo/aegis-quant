[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-quant"
version = "0.1.0"
description = "Autonomous multi-asset market intelligence, paper-trading, cross-asset allocation, and self-correcting learning engine with non-bypassable risk guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Karlo Jagar" },
]
keywords = [
    "quant",
    "trading",
    "forex",
    "equities",
    "crypto",
    "risk-management",
    "self-learning",
    "news-intelligence",
    "paper-trading",
    "backtesting",
]
dependencies = []

[project.scripts]
aegis-quant = "aegis_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
