name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and integration test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Smoke-test CLI commands
        env:
          PYTHONPATH: src
        run: |
          python -m aegis_quant.cli advise --json
          python -m aegis_quant.cli cycle --cycles 3 --json
          python -m aegis_quant.cli backtest --bars 60 --json
          python -m aegis_quant.cli learn-report --json
